[workspace]

[package]
name = "egui-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }

[features]
default = ["scroll"]
scroll = []
dashboard = ["dep:image"]
