[workspace]

[package]
name = "gui-bench-egui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
startup = []
scroll = []
virtual-scroll = []
switches = []
memory = []
hover = ["dep:raw-window-handle"]

[dependencies]
raw-window-handle = { version = "=0.6.2", optional = true }
benchmark-common = { path = "../../crates/benchmark-common" }
eframe = { version = "=0.37.0", features = ["glow"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
