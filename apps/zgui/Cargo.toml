[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "zgui-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[features]
default = ["scroll"]
scroll = []
dashboard = []
