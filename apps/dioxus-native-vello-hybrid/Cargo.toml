[workspace]

[package]
name = "gui-bench-dioxus-native-vello-hybrid"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gui-bench-dioxus-native-vello-hybrid"
path = "../dioxus-native/src/main.rs"

[dependencies]
benchmark-common = { path = "../../crates/benchmark-common" }
dioxus-native = { version = "=0.8.0-alpha.3", default-features = false, features = ["prelude", "vello-hybrid", "accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "clipboard", "file-dialog", "woff", "text-transform-icu", "apple-font-embolden"] }
blitz-dom = { version = "=0.3.0-beta.4", features = ["parallel-construct"] }
blitz-shell = "=0.3.0-beta.4"
blitz-net = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
winit = "=0.31.0-beta.3"
async-io = "=2.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
base64 = "0.22"

[features]
default = []
startup = []
scroll = []
virtual-scroll = []
switches = []
memory = []
