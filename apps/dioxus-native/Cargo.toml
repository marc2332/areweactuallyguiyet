[workspace]

[package]
name = "dioxus-native-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["skia"]
skia = ["dioxus-native/skia"]
vello-hybrid = ["dioxus-native/vello-hybrid"]

[dependencies]
dioxus-native = { version = "=0.8.0-alpha.3", default-features = false, features = ["prelude", "system-fonts"] }
