[workspace]

[package]
name = "gui-bench-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
startup = []
scroll = []
virtual-scroll = []
switches = []
memory = []

[dependencies]
benchmark-common = { path = "../../crates/benchmark-common" }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
libc = "=0.2.174"

[[bin]]
name = "gui-bench-gpui"
path = "src/main.rs"
