[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "rune-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2" }

[features]
default = ["scroll"]
scroll = []
dashboard = []
