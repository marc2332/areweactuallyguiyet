[workspace]

[package]
name = "gui-bench-rune"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
benchmark-common = { path = "../../crates/benchmark-common" }
rune = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2" }

[features]
default = []
startup = []
scroll = []
