[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "gpui-fast-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-fast", version = "=0.1.0" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.0", features = ["wayland", "x11"] }

[features]
default = ["scroll"]
scroll = []
dashboard = []
