[workspace]

[package]
name = "gui-bench-gpui-fast"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
startup = []
scroll = []
virtual-scroll = []
switches = []
memory = []
hover = ["dep:raw-window-handle"]

[dependencies]
raw-window-handle = { version = "=0.6.2", optional = true }
benchmark-common = { path = "../../crates/benchmark-common" }
gpui = { package = "gpui-fast", version = "=0.1.0" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.0", features = ["wayland", "x11"] }
libc = "=0.2.174"
unicode-segmentation = "=1.13.3"

[[bin]]
name = "gui-bench-gpui-fast"
path = "src/main.rs"
