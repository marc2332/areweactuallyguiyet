[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "freya-optimized-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
freya = { git = "https://github.com/marc2332/freya", rev = "056a5b4fc6efce1e8a7054436a2119b30d14ab4a" }

[features]
default = ["scroll"]
scroll = []
dashboard = []
