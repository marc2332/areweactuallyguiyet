[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "freya-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
freya = "=0.5.2"

[dev-dependencies]
freya-testing = "=0.5.2"

[features]
default = ["scroll"]
scroll = []
dashboard = []
