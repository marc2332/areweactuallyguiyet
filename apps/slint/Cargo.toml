[workspace]

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[package]
name = "slint-scroll"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["scroll"]
scroll = []
dashboard = []

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-femtovg", "compat-1-2"] }
