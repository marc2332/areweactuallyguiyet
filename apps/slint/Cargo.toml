[workspace]

[package]
name = "gui-bench-slint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
benchmark-common = { path = "../../crates/benchmark-common" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18"] }

[features]
