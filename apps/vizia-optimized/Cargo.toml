[workspace]

[package]
name = "gui-bench-vizia-optimized"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gui-bench-vizia-optimized"
path = "../vizia/src/main.rs"

[features]
default = []
startup = ["vizia-main"]
scroll = ["vizia-main"]
virtual-scroll = ["vizia-main"]
switches = ["vizia-main"]
memory = ["vizia-main"]
hover = ["vizia-main", "dep:winit"]
vizia-main = []

[dependencies]
benchmark-common = { path = "../../crates/benchmark-common" }
vizia = { git = "https://github.com/vizia/vizia", rev = "a8a38adbb7fd9929397abde0a6992272ead83ecc", features = ["rayon"] }
winit = { version = "=0.30.13", optional = true }
