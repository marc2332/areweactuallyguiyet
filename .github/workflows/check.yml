name: Check
on:
  push:
  pull_request:

jobs:
  site-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix site ci
      - run: npm run build
      - run: python3 -m compileall -q apps/bench.py apps/benchmark
      - run: python3 -m unittest discover -s apps/tests
